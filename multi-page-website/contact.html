<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="nav-header">
      <div class="logo">AB</div>
      <div class="nav">
        <nav>
          <ul>
            <li>
              <a href="./index.html" class="nav-link">Home</a>
            </li>
            <li>
              <a href="./about.html" class="nav-link">About</a>
            </li>
            <li>
              <a href="./contact.html" class="nav-link active">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="nav-btn">
        <a href="contact.html" class="n-btn1">Let's Talk</a>
        <a href="./Abubakkar CV.pdf" target="_blank" class="n-btn2">Download</a>
      </div>
      <div class="harm">
        <i class="fa-solid fa-bars"></i>
      </div>
    </header>
    <div>
      <section class="contact-section">
        <div class="contact-container">
          <div class="contact-info">
            <p class="contact-label">GET IN TOUCH</p>
            <h1>Let's work together.</h1>
            <p class="contact-description">
              Have a project in mind or want to discuss an opportunity? Feel
              free to reach out. I'd love to hear from you.
            </p>
            <div class="contact-details">
              <div class="contact-item">
                <div class="contact-icon">@</div>
                <div>
                  <span>Email</span>
                  <p>abubakkar@example.com</p>
                </div>
              </div>
              <div class="contact-item">
                <div class="contact-icon">☎</div>
                <div>
                  <span>Phone</span>
                  <p>+91 98765 43210</p>
                </div>
              </div>
              <div class="contact-item">
                <div class="contact-icon">⌖</div>
                <div>
                  <span>Location</span>
                  <p>Tamil Nadu, India</p>
                </div>
              </div>
            </div>
          </div>
          <div class="contact-form-container">
            <form class="contact-form">
              <div class="form-row">
                <div class="form-group">
                  <label for="name">Name</label>
                  <input type="text" id="name" placeholder="Your name" />
                </div>
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" id="email" placeholder="Your email" />
                </div>
              </div>
              <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="Project subject" />
              </div>
              <div class="form-group">
                <label for="message">Message</label>
                <textarea
                  id="message"
                  rows="6"
                  placeholder="Tell me about your project..."
                ></textarea>
              </div>
              <button type="submit" class="contact-btn">Send Message →</button>
            </form>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
